[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlasai"
version = "1.0.0"
description = "AtlasAI - Intelligent Service-to-3D Mapping Engine"
authors = [
    { name = "AtlasAI Engineering Team", email = "engineering@metadome.ai" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "trimesh>=3.20.0",
    "scipy>=1.10.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0"
]

[project.scripts]
atlasai = "atlasai.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
